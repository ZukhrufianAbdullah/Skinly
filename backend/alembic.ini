# Skinly - Alembic Configuration
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path ke folder versi migrasi
script_location = alembic

# Format nama file migrasi: tanggal_waktu_deskripsi
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Timezone untuk timestamp migrasi
timezone = UTC

# Prepend revision ID pada nama file (agar urutan jelas)
prepend_rev = false

# URL database - akan ditimpa oleh env.py dari .env
sqlalchemy.url = mysql+pymysql://root:@127.0.0.1:3306/skinly?charset=utf8mb4

[post_write_hooks]
# hooks opsional

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %%H:%%M:%%S
