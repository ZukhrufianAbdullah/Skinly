name: skinly
description: "Skinly - Aplikasi pendeteksi jenis kulit wajah berbasis Machine Learning"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # HTTP Client
  dio: ^5.7.0

  # Image picker & camera
  image_picker: ^1.1.2
  camera: ^0.11.1

  # Permissions
  permission_handler: ^11.4.0

  # Storage
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.4

  # Animations
  flutter_animate: ^4.5.2

  # Fonts
  google_fonts: ^6.2.1

  # SVG
  flutter_svg: ^2.0.16

  # Internationalization
  intl: ^0.20.2

  # Utils
  uuid: ^4.5.1
  path_provider: ^2.1.5
  path: ^1.9.1
  http_parser: ^4.1.2
  mime: ^2.0.0
  flutter_image_compress: ^2.3.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.2
  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  json_annotation: ^4.9.0
  mockito: ^5.4.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
